[package]
name = "typorax"
version = "0.1.0"
description = "本地 Markdown 写作编辑器"
edition = "2021"
license = "MIT"
rust-version = "1.90"

[lib]
name = "typorax_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.4", features = [] }
tauri-plugin-dialog = "=2.8.3"
serde = { version = "=1.0.228", features = ["derive"] }
sha2 = "=0.10.9"
base64 = "=0.22.1"
tempfile = "=3.23.0"
percent-encoding = "=2.3.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Storage_FileSystem", "Win32_Foundation"] }

[features]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
