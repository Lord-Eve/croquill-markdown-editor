name: Windows Acceptance

# Real-Windows acceptance on a GitHub-hosted Windows runner.
# Tier 1 (must pass): typecheck and Tauri release build from a clean checkout.
# Tier 2 (must pass): the built croquill.exe launches and shows its main window.
# Tier 3 (reported, see acceptance/report): keyboard-driven GUI checks whose
#   evidence is the window title and the exact bytes written to disk.
# What this does NOT cover: drag-in opening, real IME composition, Typora
#   side-by-side comparison. Those still need a human-driven Windows desktop.

# Runs on pull requests only. A squash merge puts the same code the PR run
# already checked onto main, so there is no extra run on push to main.
# Documentation-only changes are skipped; examples/** is NOT listed because
# the tests read those files. Releases trigger a run by hand (docs/release.md).
on:
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "CHANGELOG.md"
      - "README.md"
      - "AGENTS.md"
      - "CLAUDE.md"
      - "LICENSE"
  workflow_dispatch:
    inputs:
      gui_acceptance:
        description: "Run the Tier 2/3 GUI acceptance script"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: windows-acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  acceptance:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      # Vitest and cargo test are NOT run here: the builder runs the full suite
      # locally before pushing and pastes the result into the PR. On this slow
      # runner they took 8-11 minutes and timed out at random. CI keeps only
      # what a local run cannot prove: a clean-checkout build, the GUI check on
      # a fresh Windows, and the installer/file-association check.
      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build Windows release exe (no bundle)
        run: npm run tauri -- build --no-bundle

      - name: Locate built exe
        id: exe
        shell: pwsh
        run: |
          $exe = Join-Path $PWD "src-tauri\target\release\croquill.exe"
          if (-not (Test-Path -LiteralPath $exe)) { throw "croquill.exe not found at $exe" }
          "path=$exe" >> $env:GITHUB_OUTPUT
          Get-Item -LiteralPath $exe | Select-Object FullName, Length, LastWriteTime

      - name: GUI acceptance (Tier 2/3)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.gui_acceptance != false }}
        shell: pwsh
        run: >
          .\acceptance\gui-acceptance.ps1
          -ExePath "${{ steps.exe.outputs.path }}"
          -ExamplesDir (Join-Path $PWD "examples")
          -OutDir (Join-Path $PWD "acceptance-output")

      - name: Build Windows NSIS installer
        run: npm run tauri -- build --bundles nsis

      - name: Locate NSIS installer
        id: installer
        shell: pwsh
        run: |
          $nsisDir = Join-Path $PWD "src-tauri\target\release\bundle\nsis"
          $setup = Get-ChildItem -LiteralPath $nsisDir -Filter "*-setup.exe" -File -ErrorAction SilentlyContinue | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if ($null -eq $setup) { throw "NSIS setup exe (*-setup.exe) not found in $nsisDir" }
          "path=$($setup.FullName)" >> $env:GITHUB_OUTPUT
          $setup | Select-Object FullName, Length, LastWriteTime

      - name: Installer acceptance
        shell: pwsh
        run: >
          .\acceptance\installer-acceptance.ps1
          -InstallerPath "${{ steps.installer.outputs.path }}"
          -OutDir (Join-Path $PWD "installer-acceptance-output")

      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-acceptance-${{ github.sha }}
          path: |
            acceptance-output/**
            installer-acceptance-output/**
            src-tauri/target/release/croquill.exe
            src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: warn
          retention-days: 30
